<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>WOPA — Happy Shavuot</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #D8D8D8;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 30px;
}
.flyer {
  width: 1000px; height: 560px;
  background: #FFF3C4;
  border-radius: 20px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,0.22);
  display: flex;
  flex-direction: row-reverse;
}
.blob-tl {
  position: absolute;
  top: -65px; left: -65px;
  width: 310px; height: 275px;
  background: #F5E87A;
  border-radius: 55% 45% 38% 62% / 50% 62% 38% 54%;
  z-index: 1;
}
.blob-br {
  position: absolute;
  bottom: -30px; left: 340px;
  width: 90px; height: 80px;
  background: #F5E87A;
  opacity: 0.35;
  border-radius: 50%;
  z-index: 0;
}
.left {
  width: 410px;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 52px 44px 52px 56px;
}
.wopa-title {
  font-family: 'DM Sans', sans-serif;
  font-weight: 900;
  font-size: 106px;
  line-height: 0.82;
  color: #1B3A6B;
  letter-spacing: -5px;
}
.shavuot-title {
  font-family: 'DM Sans', sans-serif;
  font-weight: 900;
  font-size: 46px;
  line-height: 0.93;
  color: #1B3A6B;
  letter-spacing: -1.5px;
  margin-top: 10px;
}
.benon-sub {
  font-family: 'DM Sans', sans-serif;
  font-weight: 400;
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #1B3A6B;
  opacity: 0.55;
  margin-top: 9px;
}
.yellow-rule {
  width: 40px; height: 3px;
  background: #F5E87A;
  border-radius: 2px;
  margin: 22px 0;
}
.info-list {
  display: flex;
  flex-direction: column;
  gap: 20px;
  direction: ltr; /* icons on LEFT */
}
.info-row { display: flex; align-items: center; gap: 14px; }
.iico {
  width: 34px; height: 34px;
  background: #F5E87A;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.iico svg {
  width: 17px; height: 17px;
  stroke: #1B3A6B; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.ilbl { font-family: 'DM Sans', sans-serif; color: #1B3A6B; font-size: 15px; line-height: 1; }
.ilbl strong { font-weight: 900; font-size: 16px; }
.ilbl span { font-weight: 500; color: #1A1A1A; font-size: 14px; margin-left: 5px; }
.right {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: #E8F5E3;
}
@media print {
  body { background: white; padding: 0; }
  .flyer { box-shadow: none; border-radius: 0; }
}
</style>
</head>
<body>
<div class="flyer">
  <div class="blob-tl"></div>
  <div class="blob-br"></div>

  <!-- LEFT -->
  <div class="left">
    <div>
      <div class="wopa-title">WOPA</div>
      <div class="shavuot-title">HAPPY<br>SHAVUOT</div>
      <div class="benon-sub">with BENON'S Farmer's Market · חקלאות ישראלית</div>
    </div>
    <div class="yellow-rule"></div>
    <div class="info-list">
      <div class="info-row">
        <div class="iico">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div class="ilbl"><strong>WEDNESDAY</strong><span>20.05</span></div>
      </div>
      <div class="info-row">
        <div class="iico">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
        </div>
        <div class="ilbl"><strong>FROM</strong><span>11:00</span></div>
      </div>
      <div class="info-row">
        <div class="iico">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        </div>
        <div class="ilbl"><strong>LOBBY</strong><span>לובי הבניין</span></div>
      </div>
    </div>
  </div>

  <!-- RIGHT — Israeli agriculture illustration -->
  <div class="right">
    <svg width="100%" height="100%" viewBox="0 0 590 560" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">

      <!-- Soft background ovals -->
      <ellipse cx="310" cy="305" rx="245" ry="228" fill="#FDECD5"/>
      <ellipse cx="280" cy="220" rx="168" ry="148" fill="#FDE4C4" opacity="0.5"/>

      <!-- ═══ WHEAT STALK LEFT ═══ -->
      <g transform="translate(148, 18)">
        <line x1="28" y1="490" x2="28" y2="12" stroke="#C8900A" stroke-width="2.8" stroke-linecap="round"/>
        <ellipse cx="28" cy="17" rx="9" ry="18" fill="#D4A020"/>
        <ellipse cx="19" cy="42" rx="8" ry="14" fill="#D4A020" transform="rotate(-38 19 42)"/>
        <ellipse cx="37" cy="52" rx="8" ry="14" fill="#D4A020" transform="rotate(38 37 52)"/>
        <ellipse cx="17" cy="70" rx="7.5" ry="12" fill="#C89018" transform="rotate(-34 17 70)"/>
        <ellipse cx="39" cy="78" rx="7.5" ry="12" fill="#C89018" transform="rotate(34 39 78)"/>
        <ellipse cx="19" cy="96" rx="7" ry="11" fill="#BE8414" transform="rotate(-30 19 96)"/>
        <ellipse cx="37" cy="103" rx="7" ry="11" fill="#BE8414" transform="rotate(30 37 103)"/>
        <ellipse cx="20" cy="120" rx="6" ry="9" fill="#B47810" transform="rotate(-26 20 120)"/>
        <ellipse cx="36" cy="126" rx="6" ry="9" fill="#B47810" transform="rotate(26 36 126)"/>
        <path d="M28,215 Q64,185 86,160 Q62,175 28,215" fill="#8AAA38" opacity="0.75"/>
        <path d="M28,272 Q-2,250 -18,226 Q4,242 28,272" fill="#8AAA38" opacity="0.65"/>
      </g>

      <!-- ═══ WHEAT STALK RIGHT ═══ -->
      <g transform="translate(507, 5)">
        <line x1="28" y1="505" x2="28" y2="10" stroke="#C8900A" stroke-width="2.5" stroke-linecap="round"/>
        <ellipse cx="28" cy="15" rx="9" ry="17" fill="#D4A020"/>
        <ellipse cx="19" cy="38" rx="8" ry="13" fill="#D4A020" transform="rotate(-38 19 38)"/>
        <ellipse cx="37" cy="47" rx="8" ry="13" fill="#D4A020" transform="rotate(38 37 47)"/>
        <ellipse cx="17" cy="64" rx="7.5" ry="11" fill="#C89018" transform="rotate(-34 17 64)"/>
        <ellipse cx="39" cy="71" rx="7.5" ry="11" fill="#C89018" transform="rotate(34 39 71)"/>
        <ellipse cx="19" cy="87" rx="7" ry="10" fill="#BE8414" transform="rotate(-30 19 87)"/>
        <ellipse cx="37" cy="93" rx="7" ry="10" fill="#BE8414" transform="rotate(30 37 93)"/>
        <path d="M28,200 Q60,174 78,151 Q56,166 28,200" fill="#8AAA38" opacity="0.7"/>
        <path d="M28,258 Q0,238 -14,216 Q8,232 28,258" fill="#8AAA38" opacity="0.6"/>
      </g>

      <!-- ═══ WICKER BASKET ═══ -->
      <!-- Shadow -->
      <ellipse cx="315" cy="455" rx="130" ry="22" fill="#B8742A" opacity="0.2"/>

      <!-- Basket handle -->
      <path d="M 218,340 Q 220,250 315,248 Q 410,246 412,340" stroke="#A06428" stroke-width="22" fill="none" stroke-linecap="round"/>
      <path d="M 218,340 Q 220,260 315,258 Q 410,256 412,340" stroke="#C8844A" stroke-width="14" fill="none" stroke-linecap="round"/>
      <!-- handle highlight -->
      <path d="M 228,340 Q 230,272 315,270 Q 400,268 402,340" stroke="#DCA060" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5"/>

      <!-- Basket body -->
      <path d="M 195,342 L 195,445 Q 195,462 315,462 Q 435,462 435,445 L 435,342 Z" fill="#D4944A"/>
      <!-- Wicker horizontal lines -->
      <path d="M 195,365 Q 315,358 435,365" stroke="#B8742A" stroke-width="2.2" fill="none"/>
      <path d="M 195,388 Q 315,381 435,388" stroke="#B8742A" stroke-width="2.2" fill="none"/>
      <path d="M 195,411 Q 315,404 435,411" stroke="#B8742A" stroke-width="2.2" fill="none"/>
      <path d="M 195,434 Q 315,427 435,434" stroke="#B8742A" stroke-width="2.2" fill="none"/>
      <!-- Wicker vertical dividers -->
      <line x1="235" y1="342" x2="235" y2="462" stroke="#B8742A" stroke-width="1.5" opacity="0.4"/>
      <line x1="275" y1="342" x2="275" y2="462" stroke="#B8742A" stroke-width="1.5" opacity="0.4"/>
      <line x1="315" y1="342" x2="315" y2="462" stroke="#B8742A" stroke-width="1.5" opacity="0.4"/>
      <line x1="355" y1="342" x2="355" y2="462" stroke="#B8742A" stroke-width="1.5" opacity="0.4"/>
      <line x1="395" y1="342" x2="395" y2="462" stroke="#B8742A" stroke-width="1.5" opacity="0.4"/>

      <!-- Basket rim (top ring) -->
      <ellipse cx="315" cy="342" rx="120" ry="26" fill="#C07A32"/>
      <ellipse cx="315" cy="339" rx="117" ry="23" fill="#D89448"/>
      <ellipse cx="315" cy="337" rx="112" ry="20" fill="#BE7830" opacity="0.4"/>

      <!-- ═══ PRODUCE OVERFLOWING ═══ -->

      <!-- Back herbs / parsley (behind everything) -->
      <g transform="translate(295,228)">
        <line x1="-8" y1="90" x2="-28" y2="30" stroke="#3A7818" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-8" y1="90" x2="-5" y2="20" stroke="#3A7818" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-8" y1="90" x2="18" y2="32" stroke="#3A7818" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="-28" cy="24" r="20" fill="#5AA830" opacity="0.9"/>
        <circle cx="-10" cy="14" r="17" fill="#68BA38" opacity="0.85"/>
        <circle cx="18" cy="26" r="19" fill="#5AA830" opacity="0.9"/>
        <circle cx="5" cy="10" r="14" fill="#78CC44" opacity="0.8"/>
      </g>

      <!-- Sunflower (right back) -->
      <g transform="translate(400,210)">
        <!-- petals -->
        <ellipse cx="0" cy="-28" rx="8" ry="18" fill="#F5C820" transform="rotate(0)"/>
        <ellipse cx="0" cy="-28" rx="8" ry="18" fill="#F5C820" transform="rotate(30)"/>
        <ellipse cx="0" cy="-28" rx="8" ry="18" fill="#F5C820" transform="rotate(60)"/>
        <ellipse cx="0" cy="-28" rx="8" ry="18" fill="#F5C820" transform="rotate(90)"/>
        <ellipse cx="0" cy="-28" rx="8" ry="18" fill="#F5C820" transform="rotate(120)"/>
        <ellipse cx="0" cy="-28" rx="8" ry="18" fill="#F5C820" transform="rotate(150)"/>
        <ellipse cx="0" cy="-28" rx="8" ry="18" fill="#F5C820" transform="rotate(180)"/>
        <ellipse cx="0" cy="-28" rx="8" ry="18" fill="#F5C820" transform="rotate(210)"/>
        <ellipse cx="0" cy="-28" rx="8" ry="18" fill="#F5C820" transform="rotate(240)"/>
        <ellipse cx="0" cy="-28" rx="8" ry="18" fill="#F5C820" transform="rotate(270)"/>
        <ellipse cx="0" cy="-28" rx="8" ry="18" fill="#F5C820" transform="rotate(300)"/>
        <ellipse cx="0" cy="-28" rx="8" ry="18" fill="#F5C820" transform="rotate(330)"/>
        <!-- center -->
        <circle cx="0" cy="0" r="18" fill="#5A3010"/>
        <circle cx="0" cy="0" r="13" fill="#6A3A14"/>
        <!-- small seeds pattern -->
        <circle cx="-5" cy="-5" r="2.5" fill="#4A2808" opacity="0.7"/>
        <circle cx="5" cy="-5" r="2.5" fill="#4A2808" opacity="0.7"/>
        <circle cx="0" cy="5" r="2.5" fill="#4A2808" opacity="0.7"/>
        <circle cx="-6" cy="3" r="2" fill="#4A2808" opacity="0.6"/>
        <circle cx="6" cy="3" r="2" fill="#4A2808" opacity="0.6"/>
      </g>

      <!-- Pomegranate (רימון — very Israeli) -->
      <g transform="translate(240,268)">
        <circle cx="0" cy="0" r="28" fill="#C83838"/>
        <!-- shine -->
        <ellipse cx="-8" cy="-10" rx="10" ry="7" fill="#E04848" opacity="0.5"/>
        <!-- crown (crown of the pomegranate) -->
        <path d="M-14,-26 L-16,-38 M-7,-27 L-8,-40 M0,-28 L0,-41 M7,-27 L8,-40 M14,-26 L16,-38" stroke="#4A2010" stroke-width="2.5" stroke-linecap="round"/>
        <ellipse cx="0" cy="-24" rx="16" ry="7" fill="#5A2A14" opacity="0.6"/>
      </g>

      <!-- Cherry tomatoes cluster -->
      <g transform="translate(360,275)">
        <circle cx="0" cy="0" r="19" fill="#E03030"/>
        <circle cx="-20" cy="-8" r="16" fill="#D02828"/>
        <circle cx="18" cy="-10" r="17" fill="#E84040"/>
        <circle cx="-5" cy="-22" r="14" fill="#CC2020"/>
        <!-- stems -->
        <path d="M0,-18 Q2,-26 0,-30" stroke="#2A7010" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M-20,-23 Q-18,-30 -20,-34" stroke="#2A7010" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M18,-26 Q20,-32 19,-36" stroke="#2A7010" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M-5,-35 Q-3,-42 -4,-46" stroke="#2A7010" stroke-width="2" stroke-linecap="round" fill="none"/>
        <!-- leaf on top -->
        <path d="M0,-30 Q8,-36 10,-42 Q4,-36 0,-30" fill="#3A8820" opacity="0.9"/>
      </g>

      <!-- Avocado (אבוקדו) -->
      <g transform="translate(308,290) rotate(-15)">
        <ellipse cx="0" cy="0" rx="20" ry="30" fill="#2A5A18"/>
        <ellipse cx="0" cy="3" rx="13" ry="20" fill="#3E7828"/>
        <ellipse cx="0" cy="6" rx="8" ry="12" fill="#C8880C"/>
      </g>

      <!-- Lemon -->
      <g transform="translate(265,303)">
        <ellipse cx="0" cy="0" rx="22" ry="18" fill="#F5C820"/>
        <!-- highlight -->
        <ellipse cx="-6" cy="-5" rx="9" ry="7" fill="#F8D840" opacity="0.6"/>
        <!-- tip -->
        <ellipse cx="20" cy="0" rx="4" ry="3" fill="#E8B410"/>
        <ellipse cx="-20" cy="0" rx="4" ry="3" fill="#E8B410"/>
      </g>

      <!-- ═══ OLIVE BRANCH (bottom right) ═══ -->
      <g transform="translate(420,370)">
        <line x1="0" y1="90" x2="-40" y2="20" stroke="#3A5020" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="-40" y1="20" x2="-62" y2="0" stroke="#3A5020" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="-12" cy="72" rx="11" ry="5.5" fill="#4A6828" transform="rotate(42 -12 72)"/>
        <ellipse cx="-26" cy="50" rx="11" ry="5.5" fill="#4A6828" transform="rotate(37 -26 50)"/>
        <ellipse cx="-40" cy="30" rx="10" ry="5" fill="#3E5C22" transform="rotate(30 -40 30)"/>
        <ellipse cx="-54" cy="14" rx="9" ry="4.5" fill="#3E5C22" transform="rotate(24 -54 14)"/>
        <circle cx="-8" cy="68" r="4.5" fill="#2A3870" opacity="0.85"/>
        <circle cx="-22" cy="46" r="4.5" fill="#2A3870" opacity="0.85"/>
        <circle cx="-38" cy="26" r="4" fill="#344088" opacity="0.8"/>
        <circle cx="-52" cy="10" r="3.5" fill="#344088" opacity="0.75"/>
      </g>

      <!-- Small grape cluster (ענבים) -->
      <g transform="translate(225,318)">
        <circle cx="0" cy="20" r="9" fill="#6A2880"/>
        <circle cx="-10" cy="11" r="9" fill="#7A3490"/>
        <circle cx="10" cy="11" r="9" fill="#7A3490"/>
        <circle cx="0" cy="2" r="9" fill="#6A2880"/>
        <circle cx="-10" cy="-7" r="9" fill="#7A3490"/>
        <circle cx="10" cy="-7" r="9" fill="#7A3490"/>
        <circle cx="0" cy="-16" r="9" fill="#6A2880"/>
        <!-- vine -->
        <path d="M0,-24 Q5,-32 8,-38" stroke="#3A5820" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M8,-38 Q14,-34 16,-28" stroke="#3A5820" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <!-- leaf -->
        <path d="M8,-38 Q-2,-48 -8,-44 Q-2,-42 8,-38" fill="#4A7828" opacity="0.85"/>
      </g>

    </svg>
  </div>
</div>
</body>
</html>
